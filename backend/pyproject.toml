[project]
name = "screenshot-to-code-backend"
version = "0.1.0"
description = "Screenshot to Code Backend API"
requires-python = ">=3.10,<3.13"

dependencies = [
    "fastapi[standard]>=0.115.6",
    "uvicorn>=0.25.0",
    "websockets>=14.1",
    "openai==2.16.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.2",
    "httpx>=0.28.1",
    "pre-commit>=3.6.2",
    "anthropic>=0.84.0",
    "moviepy>=1.0.3",
    "pillow>=10.3.0",
    "types-pillow>=10.2.0.20240520",
    "aiohttp>=3.9.5",
    "pydantic>=2.10",
    "google-genai>=1.16.1",
    "langfuse>=3.0.2",
    "playwright>=1.61.0",
    "pillow-heif>=0.18.0"
]

[tool.fastapi]
entrypoint = "main:app"

[tool.uv]
package = false

[tool.setuptools]
packages = []
py-modules = []

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
